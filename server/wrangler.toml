name = "questdojo-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = false
routes = [ { pattern = "questdojorpg.mathaday.app/api/*", zone_name = "mathaday.app" } ]

[[d1_databases]]
binding = "DB"
database_name = "questdojo"
database_id = "e677a635-0926-4ced-9e25-b841ed44cf4e"

# Read-only use: looks up the Math a Day sign-in session (account.mathaday.app) to know who is playing.
[[d1_databases]]
binding = "ACCOUNT_DB"
database_name = "mathaday-account"
database_id = "fd6a0f95-1fed-49da-a227-48b6befcd901"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]
